[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-data-analyzer"
version = "1.0.0"
description = "Analisador de dados Pokemon: PokeAPI ou CSV, relatorio estatistico, graficos e exportacao pra SQLite/JSON/HTML."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "requests>=2.31",
    "tqdm>=4.66",
    "questionary>=2.0",
]

[project.scripts]
pokemon-data-analyzer = "run_extractor:main"

[tool.setuptools]
py-modules = ["run_extractor"]

[tool.setuptools.packages.find]
include = ["pokedata*"]
