<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extrator e Analisador de Dados Pokemon</title>
<meta name="description" content="Dashboard estatico dos dados extraidos e analisados da PokeAPI: tipos, stats, correlacoes e graficos.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <h1>Extrator e Analisador de Dados Pokemon</h1>
  <button id="theme-toggle" class="icon-button" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema">
    <span class="icon-sun" aria-hidden="true">&#9728;</span>
    <span class="icon-moon" aria-hidden="true">&#9789;</span>
  </button>
</header>

<main>
  <section class="filters" aria-label="Filtros">
    <label>
      Geracao
      <select id="filter-generation">
        <option value="">Todas</option>
      </select>
    </label>
    <label>
      Tipo
      <select id="filter-type">
        <option value="">Todos</option>
      </select>
    </label>
    <label class="search-label">
      Buscar Pokemon
      <input id="filter-search" type="search" placeholder="ex: pikachu">
    </label>
  </section>

  <section class="stats-grid" id="stats-grid" aria-label="Resumo estatistico"></section>

  <section class="charts-grid">
    <div class="chart-card">
      <h2>Tipos primarios mais comuns</h2>
      <div id="chart-types" class="chart"></div>
    </div>
    <div class="chart-card">
      <h2>Velocidade media por tipo</h2>
      <div id="chart-speed" class="chart"></div>
    </div>
    <div class="chart-card">
      <h2>Peso x Defesa</h2>
      <div id="chart-scatter" class="chart"></div>
    </div>
    <div class="chart-card">
      <h2>Top 10 em ataque</h2>
      <div id="chart-attack" class="chart"></div>
    </div>
  </section>

  <section class="chart-card correlation-card">
    <h2>Correlacao entre stats, altura e peso</h2>
    <div id="chart-correlation" class="chart"></div>
  </section>

  <section class="table-section">
    <h2>Dataset (<span id="table-count">0</span> Pokemon)</h2>
    <div class="table-wrap">
      <table id="pokemon-table">
        <thead>
          <tr>
            <th>#</th><th>Nome</th><th>Tipo 1</th><th>Tipo 2</th>
            <th>HP</th><th>Ataque</th><th>Defesa</th><th>Vel.</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<footer>
  <p>Dados via <a href="https://pokeapi.co" target="_blank" rel="noopener">PokeAPI</a>. Codigo no
    <a href="https://github.com/GuilhermeAraujoDeCastro/Extrator-e-Analisador-de-Dados-Pok-mon" target="_blank" rel="noopener">GitHub</a>.</p>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
